# Faber login theme. Extends keycloak.v2 so only what differs lives here.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is v2's own; faber.css is appended so it wins on equal specificity.
styles=css/styles.css css/faber.css

# Off on purpose: v2's script follows prefers-color-scheme; Faber ships its own dark-mode script.
darkMode=false

locales=en,uk
faberCookieDomain=${env.FABER_COOKIE_DOMAIN:}
