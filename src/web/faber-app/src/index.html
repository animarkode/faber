<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>microcivi.com</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@300..700&family=Space+Grotesk:wght@600..700&family=Playfair+Display:wght@700..900&family=Google+Sans:wght@500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
      // Apply the theme before first paint to prevent a flash of the wrong theme
      // on hard reload. Same order as ThemeService and the Keycloak login theme:
      // the shared 'faber-theme' cookie, then localStorage, then the OS preference.
      try {
        var m = document.cookie.match(/(?:^|; )faber-theme=(dark|light)/);
        var stored = m ? m[1] : localStorage.getItem('faber-theme');
        var dark = stored === 'dark' || stored === 'light'
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
