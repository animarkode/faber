@if (accountDeleted()) {
  <p role="status" class="text-center text-sm text-foreground py-3 bg-card border-b-[0.5px] border-line" data-test="account-deleted">
    Your account has been deleted.
  </p>
}
<div class="dotted-background relative overflow-hidden min-h-[calc(100vh-var(--navbar-height))] flex items-center">
  <div class="max-w-5xl mx-auto px-6 py-24 relative z-10 text-center">
    <h1 class="font-serif text-[2.25rem] font-extrabold leading-[1.1] text-foreground md:text-5xl lg:text-6xl">
      Your next career move<br/>starts with a great CV
    </h1>

    <p class="text-lg text-gray-500 mt-6 mx-auto leading-relaxed">
      Create a professional CV in minutes with <span class="font-sans font-bold text-foreground">microcivi.com</span>
    </p>

    <div class="mt-10">
      <a [routerLink]="link"
         class="inline-block px-8 py-3.5 rounded-full bg-primary text-gray-900 font-semibold text-lg transition-all duration-200 hover:brightness-[0.92] hover:shadow-lg hover:shadow-primary/30 hover:scale-105">
        Build your CV for free
      </a>
    </div>
  </div>
</div>
