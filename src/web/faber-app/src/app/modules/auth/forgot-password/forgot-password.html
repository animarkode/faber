<fb-auth-card aria-label="Reset your password">
  <h1 class="mb-8 text-center font-serif text-4xl font-bold text-foreground">Forgot password?</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
    <fb-input formControlName="email" label="Email address"
              placeholder="john@example.com" autocomplete="email" type="email" />

    <button
      fb-button
      variant="primary"
      size="lg"
      type="submit"
      [disabled]="loading()"
      class="w-full font-bold tracking-[0.01em]">
      @if (loading()) {
        <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-solid border-current border-e-transparent"
              role="status" aria-label="Loading"></span>
      } @else {
        Continue
      }
    </button>
  </form>
</fb-auth-card>

<fb-toast
  [message]="sent() ? 'Check your email for reset instructions.' : null"
  variant="info"
  (dismissed)="sent.set(false)" />
<fb-toast
  [message]="error() ? 'Something went wrong. Try again later.' : null"
  variant="error"
  (dismissed)="error.set(false)" />
