<fb-auth-card aria-label="Verify email">
  <h1 class="mb-8 text-center font-serif text-4xl font-bold text-foreground">Verify email</h1>

  @if (verifying()) {
    <div class="flex flex-col items-center gap-4 text-center" role="status" aria-live="polite">
      <span class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-full bg-card px-4 text-[0.95rem] font-bold tracking-[0.01em] text-muted-foreground dark:text-foreground">
        <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-solid border-current border-e-transparent" aria-hidden="true"></span>
        Verifying…
      </span>
    </div>

  } @else if (error()) {
    <div class="flex flex-col items-center gap-4 text-center" role="alert">
      <span class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-full bg-destructive px-4 text-[0.95rem] font-bold tracking-[0.01em] text-destructive-foreground">
        <lucide-icon name="x" [size]="16" [strokeWidth]="2.5" class="shrink-0" aria-hidden="true" />
        Not verified
      </span>
      <button
        fb-button
        variant="primary"
        size="lg"
        type="button"
        (click)="navigateToSignIn()"
        class="w-full font-bold tracking-[0.01em]">
        Go to Sign In
      </button>
    </div>

  } @else if (verified()) {
    <div class="flex flex-col items-center gap-4 text-center" role="status">
      <span class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-full bg-success-soft px-4 text-[0.95rem] font-bold tracking-[0.01em] text-success-text">
        <lucide-icon name="check" [size]="16" [strokeWidth]="2.5" class="shrink-0" aria-hidden="true" />
        Email verified
      </span>
      <button
        fb-button
        variant="primary"
        size="lg"
        type="button"
        (click)="navigateToSignIn()"
        class="w-full font-bold tracking-[0.01em]">
        Continue
      </button>
    </div>
  }
</fb-auth-card>
