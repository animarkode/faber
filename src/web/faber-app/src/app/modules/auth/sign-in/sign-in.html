<fb-auth-card aria-label="Sign in">
  <h1 class="mb-8 text-center font-serif text-4xl font-bold text-foreground">Sign in</h1>

  @if (choice.formShown()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      <fb-input formControlName="userName" label="Username"
                placeholder="JohnDoe" autocomplete="username" />

      <fb-input formControlName="password" label="Password" type="password"
                placeholder="••••••••" autocomplete="current-password" [showToggle]="true" />

      <a class="-mt-2 self-center text-sm font-semibold text-muted-foreground no-underline transition-colors hover:text-foreground hover:underline"
         [routerLink]="APP_ROUTES.auth.forgotPassword">
        Forgot password?
      </a>

      <button
        fb-button
        variant="primary"
        size="lg"
        type="submit"
        [disabled]="loading()"
        class="w-full font-bold tracking-[0.01em]">
        @if (loading()) {
          <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-solid border-current border-e-transparent"
                role="status" aria-label="Loading"></span>
        } @else {
          Continue
        }
      </button>
    </form>
  } @else if (choice.settled()) {
    <app-social-sign-in divider="after" />
    <button
      fb-button
      variant="primary"
      size="lg"
      type="button"
      class="w-full font-bold tracking-[0.01em]"
      (click)="choice.showForm()">
      <lucide-icon name="at-sign" [size]="20" [strokeWidth]="2" aria-hidden="true" />
      Continue with email
    </button>
  }

  @if (choice.firstView()) {
    <div class="mt-8 flex flex-col items-center gap-2.5">
      <p class="m-0 text-sm text-muted-foreground">Don't have an account?</p>
      <a fb-button variant="menu" size="lg" class="w-full" [routerLink]="APP_ROUTES.auth.signUp">Create account</a>
    </div>
  }
</fb-auth-card>

<fb-toast
  [message]="toastMessage()"
  variant="error"
  (dismissed)="dismissToast()" />
