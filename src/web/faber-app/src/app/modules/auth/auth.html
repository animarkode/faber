<div class="dotted-background relative h-dvh overflow-y-auto overscroll-none">
  <!-- Floats over the page so the content centres on the full height. Same spacing as the app navbar. -->
  <header class="absolute inset-x-0 top-0 z-10">
    <div class="mx-auto flex max-w-screen-xl items-center justify-between p-4">
      <a [routerLink]="APP_ROUTES.home"
         class="font-display text-2xl font-semibold whitespace-nowrap text-foreground no-underline">
        microcivi.com
      </a>
      <fb-theme-toggle />
    </div>
  </header>

  <!-- Top and bottom padding equal the header's height (p-4 around the 40px toggle), keeping the content clear of it. -->
  <main class="flex min-h-full items-center justify-center px-6 py-18 max-sm:px-0">
    <router-outlet />
  </main>
</div>
