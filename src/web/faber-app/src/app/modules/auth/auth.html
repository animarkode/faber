<div class="dotted-background flex h-dvh flex-col overflow-y-auto overscroll-none">
  <header class="flex items-center justify-between px-10 py-6 max-sm:px-4 max-sm:py-3">
    <a [routerLink]="APP_ROUTES.home"
       class="font-display text-2xl font-semibold whitespace-nowrap text-foreground no-underline max-sm:text-xl">
      microcivi.com
    </a>
    <div class="max-sm:hidden">
      <fb-theme-toggle />
    </div>
  </header>

  <main class="flex flex-1 justify-center px-6 sm:items-center max-sm:px-0">
    <router-outlet />
  </main>

  <!-- On a phone the toggle moves out of the header, below the form. -->
  <footer class="flex justify-center pt-6 pb-8 sm:hidden">
    <fb-theme-toggle />
  </footer>
</div>
