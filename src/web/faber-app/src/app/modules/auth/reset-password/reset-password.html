<fb-auth-card aria-label="Reset password">
  <h1 class="mb-8 text-center font-serif text-4xl font-bold text-foreground">Reset password</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
    <fb-input formControlName="newPassword"        label="New password"     placeholder="••••••••" autocomplete="new-password" type="password" [showToggle]="true" />
    <fb-input formControlName="confirmNewPassword" label="Confirm password" placeholder="••••••••" autocomplete="new-password" type="password" [showToggle]="true" />

    <button
      fb-button
      variant="primary"
      size="lg"
      type="submit"
      [disabled]="loading()"
      class="w-full font-bold tracking-[0.01em]">
      @if (loading()) {
        <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-solid border-current border-e-transparent"
              role="status" aria-label="Loading"></span>
      } @else {
        Continue
      }
    </button>
  </form>
</fb-auth-card>

<fb-toast
  [message]="invalidReset() ? 'Something went wrong. Try again later.' : null"
  variant="error"
  (dismissed)="invalidReset.set(false)" />
