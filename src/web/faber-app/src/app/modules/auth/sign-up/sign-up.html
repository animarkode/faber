<fb-auth-card aria-label="Sign up">
  <header class="relative mb-8 flex w-full flex-col items-start gap-2.5 text-left">
    <div class="flex w-full items-center justify-between">
      <span class="font-serif text-4xl font-bold text-foreground">Sign up</span>
      <div class="flex items-center gap-1.5">
        @if (choice.canGoBack()) {
          <button
            fb-icon-button
            intent="surface"
            size="lg"
            type="button"
            aria-label="Back to other sign-up options"
            title="Back to other sign-up options"
            (click)="choice.showOptions()">
            <lucide-icon name="arrow-left" [size]="18" [strokeWidth]="2" aria-hidden="true" />
          </button>
        }
        <fb-theme-toggle />
        <a fb-icon-button intent="surface" size="lg" routerLink="/" aria-label="Go to home page">
          <lucide-icon name="x" [size]="18" [strokeWidth]="2" aria-hidden="true" />
        </a>
      </div>
    </div>
    <p class="max-w-[34ch] text-[0.96rem] leading-relaxed text-muted-foreground">
      Create your account and start building your CV.
    </p>
  </header>

  @if (choice.formShown()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      <fb-input formControlName="userName"        label="Username"         placeholder="LegendaryJohnDoe" autocomplete="username" />
      <fb-input formControlName="firstName"       label="First name"       placeholder="John"             autocomplete="given-name" />
      <fb-input formControlName="lastName"        label="Last name"        placeholder="Doe"              autocomplete="family-name" />
      <fb-input formControlName="email"           label="Email address"    placeholder="john@example.com" autocomplete="email" type="email" />
      <fb-input formControlName="password"        label="Password"         placeholder="••••••••" autocomplete="new-password"  type="password" [showToggle]="true" />
      <fb-input formControlName="confirmPassword" label="Confirm password" placeholder="••••••••" autocomplete="new-password"  type="password" [showToggle]="true" />

      <button
        fb-button
        variant="primary"
        size="lg"
        type="submit"
        [disabled]="loading()"
        class="w-full font-bold tracking-[0.01em]">
        @if (loading()) {
          <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-solid border-current border-e-transparent"
                role="status" aria-label="Loading"></span>
        } @else {
          Sign up
        }
      </button>
    </form>
  } @else if (choice.settled()) {
    <div class="flex flex-col gap-3">
      <app-social-sign-in divider="after" />
      <button
        data-email-option
        fb-button
        variant="primary"
        size="lg"
        type="button"
        class="w-full font-bold tracking-[0.01em]"
        (click)="choice.showForm()">
        <lucide-icon name="mail" [size]="20" [strokeWidth]="2" aria-hidden="true" />
        Sign up with email
      </button>
    </div>
  }
</fb-auth-card>

<fb-toast
  [message]="errorMessage()"
  variant="error"
  (dismissed)="invalidRegister.set(false); errors.set([])" />
