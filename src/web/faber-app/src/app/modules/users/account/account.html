<div class="max-w-lg mx-auto mt-10 px-4">
  <h1 class="font-serif text-2xl font-bold text-foreground mb-6">Account</h1>

  <div class="bg-card border-[0.5px] border-line rounded-xl p-6 flex flex-col gap-4">

    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-muted-foreground">Name</span>
      <span class="text-foreground">{{ displayName() }}</span>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-muted-foreground">Email</span>
      <span class="text-foreground">{{ user()?.email }}</span>
    </div>

    <hr class="border-line" />

    <p class="text-sm text-muted-foreground">
      Your name, email, password, passkeys, two-factor authentication, linked Google and GitHub
      sign-ins and active sessions are managed on the account page.
    </p>

    @if (user(); as user) {
      <div class="flex justify-end">
        <a [href]="user.accountUrl" fb-button variant="primary" data-test="manage-account">Manage account</a>
      </div>
    }
  </div>
</div>
