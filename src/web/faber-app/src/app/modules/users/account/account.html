<div class="max-w-2xl mx-auto mt-10 mb-10 px-4 flex flex-col gap-6">
  <h1 class="font-serif text-2xl font-bold text-foreground">Account</h1>

  <p role="status" class="text-sm" [class.text-destructive-text]="failed()" [class.text-foreground]="!failed()" data-test="status">{{ statusMessage() }}</p>

  <app-personal-info />
  <app-signing-in />
  <app-device-activity />
  <app-linked-accounts />

  <section class="bg-card border-[0.5px] border-destructive-text rounded-xl p-6 flex flex-col gap-3" aria-labelledby="danger-zone-heading">
    <h2 id="danger-zone-heading" class="font-serif text-lg font-bold text-foreground">Danger zone</h2>
    <p class="text-sm text-muted-foreground">Deleting your account permanently removes it and your ability to sign in.</p>
    <div>
      <button type="button" fb-button variant="destructive" data-test="delete-account" (click)="deleteAccount()">
        Delete account
      </button>
    </div>
  </section>
</div>
