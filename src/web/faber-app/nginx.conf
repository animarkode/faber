# nginx configuration for the faber-web image (ghcr.io/<OWNER>/faber-web).
#
# This image is a static server for the Angular build of faber-app — nothing
# more. It is NOT templated: it needs no environment variables and no mounts,
# and can be run as-is with a bare `docker run`.
#
# TLS termination, subdomain routing, rate limiting, and proxying to an API
# are deployment concerns and belong to the edge proxy in front of this
# container, not inside the image. In particular, there is no /api/ proxy
# here: a bare `docker run` of this image has no API sitting beside it, and
# baking an upstream name into the image would make it depend on one specific
# deployment's service names. Routing /api/ to the API is the edge's job; the
# SPA itself calls a relative /api/v1, so it works unmodified behind any edge
# that provides that routing.

worker_processes auto;
events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    # The stock mime.types has no entry for .mjs, so it would be served as
    # application/octet-stream — which browsers refuse to run as a module
    # script. The PDF.js worker ships as .mjs.
    types {
        text/javascript mjs;
    }
    default_type  application/octet-stream;

    server_tokens off;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml
               application/javascript application/json;
    gzip_comp_level 6;

    server {
        listen 80;
        listen [::]:80;

        root /usr/share/nginx/html;
        index index.html;

        # Angular SPA handling: deep links fall back to index.html, which must
        # never be cached so a new deployment is picked up on the next load.
        location / {
            try_files $uri $uri/ /index.html;

            # Security headers
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # CSP notes:
            #  - style-src and font-src allow https://fonts.googleapis.com and
            #    https://fonts.gstatic.com respectively. src/index.html pulls two
            #    Google Fonts stylesheets; without these the fonts would be blocked.
            #  - there is no separate script-src-elem directive. script-src-elem
            #    overrides script-src for <script> elements, and src/index.html has
            #    an inline theme-bootstrap script that needs 'unsafe-inline' to run.
            #  - connect-src is 'self': the SPA calls its API at a relative /api/v1,
            #    so no other origin needs to be allowed.
            #  - 'unsafe-eval' is retained deliberately. pdfjs-dist can fall back to
            #    eval for font rendering; tightening this is a follow-up, not part
            #    of this change.
            #
            # Keep the CSP value on one line for HTTP/2-compatible headers.
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' blob:; frame-src 'self'; object-src 'none';" always;

            add_header Cache-Control "no-cache";
        }

        # Cache hashed static assets. A missing file here is a 404, never the
        # SPA fallback: index.html served as 200 text/html for a script or
        # stylesheet URL hides a broken build behind a confusing browser error.
        location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2?)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Container healthcheck target, probed via busybox wget in the Dockerfile.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200;
        }
    }
}
