name: Container build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: faber-api
            context: .
            dockerfile: src/api/Faber.Api/Dockerfile
          - image: faber-migrations
            context: .
            dockerfile: src/api/Jobs/Faber.Migrations/Dockerfile
          - image: faber-web
            context: src/web/faber-app
            dockerfile: src/web/faber-app/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Only faber-web is run afterwards, so only it is loaded into the
          # local image store.
          load: ${{ matrix.image == 'faber-web' }}
          tags: faber/${{ matrix.image }}:pr
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Smoke-test faber-web
        if: matrix.image == 'faber-web'
        run: src/web/faber-app/scripts/smoke-test-image.sh faber/faber-web:pr
