name: Container build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: faber-api
            context: .
            dockerfile: src/api/Faber.Api/Dockerfile
          - image: faber-migrations
            context: .
            dockerfile: src/api/Jobs/Faber.Migrations/Dockerfile
          - image: faber-web
            context: src/web/faber-app
            dockerfile: src/web/faber-app/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Only faber-web is run afterwards, so only it is loaded into the
          # local image store.
          load: ${{ matrix.image == 'faber-web' }}
          tags: faber/${{ matrix.image }}:pr
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Smoke-test faber-web
        if: matrix.image == 'faber-web'
        run: src/web/faber-app/scripts/smoke-test-image.sh faber/faber-web:pr
