name: Build and push Docker images

# A release that release-please creates with the default GITHUB_TOKEN does not
# raise a `release` event that starts other workflows, so release-please.yml
# calls this workflow directly and passes the tag it created. The `release`
# trigger still covers releases a maintainer publishes by hand.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to check out and to tag the images with.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A container image repository name must be lowercase, but an owner login
      # may not be, so interpolating github.repository_owner into a tag fails the
      # push. Derive the namespace once and use it for every image below.
      - name: Resolve image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push faber-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/api/Faber.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/faber-api:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAMESPACE }}/faber-api:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push faber-migrations
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/api/Jobs/Faber.Migrations/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/faber-migrations:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAMESPACE }}/faber-migrations:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Unlike the two steps above, this one builds from the app directory
      # (src/web/faber-app), which is where its Dockerfile's COPY paths and
      # .dockerignore are rooted. The gha cache is given an explicit scope so
      # this image does not share — and clobber — the default cache namespace
      # the other two images use.
      - name: Build and push faber-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/web/faber-app
          file: src/web/faber-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/faber-web:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAMESPACE }}/faber-web:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=faber-web
          cache-to: type=gha,mode=max,scope=faber-web
